{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
  <h1>{{ title }}</h1>
  <p><strong>{{ account.user }}</strong> currently has {{ account.available_points }} available points.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row">
      <input type="submit" value="Record adjustment" class="default">
      <a href="{% url 'admin:loyalty_loyaltyaccount_change' account.pk %}" class="button cancel-link">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
