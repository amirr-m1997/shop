{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>صفحه پیدا نشد | فروشگاه مد</title>
    <style>
        @font-face { font-family: Vazirmatn; font-style: normal; font-weight: 400 700; src: url("{% static 'admin/fonts/Vazirmatn-Regular.woff2' %}") format("woff2"); }
        :root { color-scheme: light; font-family: Vazirmatn, Tahoma, sans-serif; }
        body { align-items: center; background: radial-gradient(circle at 80% 15%, #dbeafe, transparent 32rem), #f0f7ff; color: #172554; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 1.5rem; }
        main { background: rgb(255 255 255 / 88%); border: 1px solid #cfe0fb; border-radius: 1.5rem; box-shadow: 0 24px 60px rgb(30 64 175 / 12%); max-width: 35rem; padding: 3rem; text-align: center; width: 100%; }
        .icon { align-items: center; background: #dbeafe; border-radius: 1rem; color: #2563eb; display: inline-flex; font-size: 2.4rem; height: 5rem; justify-content: center; width: 5rem; }
        h1 { font-size: clamp(3.5rem, 12vw, 6rem); letter-spacing: -.08em; line-height: 1; margin: 1.25rem 0 .5rem; }
        h2 { color: #1e3a8a; font-size: 1.3rem; margin: 0; }
        p { color: #64748b; line-height: 2; margin: .8rem 0 1.75rem; }
        a { background: #2563eb; border-radius: .7rem; color: white; display: inline-block; font-weight: 700; padding: .75rem 1.1rem; text-decoration: none; }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <main>
        <div class="icon">⌕</div>
        <h1>۴۰۴</h1>
        <h2>این صفحه پیدا نشد</h2>
        <p>ممکن است آدرس را اشتباه وارد کرده باشید یا صفحه مورد نظر جابه‌جا شده باشد.</p>
        <a href="/">بازگشت به صفحه اصلی</a>
    </main>
</body>
</html>
